name: Azure Static Web Apps CI/CD

# Déploiement TenantPulse vers Azure Static Web Apps (ressource « tenantpulse-prod »,
# RG gr-tenantpulse-prod). Site 100 % statique : aucun build (skip_app_build).
# Le jeton de déploiement est stocké dans le secret repo AZURE_STATIC_WEB_APPS_API_TOKEN.

on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize, reopened, closed]
    branches:
      - main

jobs:
  build_and_deploy_job:
    if: github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.action != 'closed')
    runs-on: ubuntu-latest
    name: Build and Deploy
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      # app_location vaut "/" : sans cette étape, le dossier de l'extension de
      # navigateur serait publié sur le site statique. Il n'a rien à y faire.
      - name: Retirer l'extension navigateur du déploiement
        run: rm -rf extension
      - name: Build And Deploy
        id: builddeploy
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: "upload"
          app_location: "/"      # racine du repo = racine du site
          api_location: "api"    # Azure Functions (classification, tags, rôles…)
          output_location: ""    # pas de dossier de build
          skip_app_build: true   # front statique servi tel quel (l'API est buildée à part)

  close_pull_request_job:
    if: github.event_name == 'pull_request' && github.event.action == 'closed'
    runs-on: ubuntu-latest
    name: Close Pull Request
    steps:
      - name: Close Pull Request
        id: closepullrequest
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          action: "close"
